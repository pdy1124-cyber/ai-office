<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>responsive check</title>
<style>
  html,body{margin:0;background:#0b0f16;color:#8fa3c4;font:12px/1.4 -apple-system,"Malgun Gothic",sans-serif}
  .row{display:flex;gap:22px;padding:18px;align-items:flex-start}
  figure{margin:0}
  figcaption{margin:0 0 6px;font-size:11px;letter-spacing:.04em;color:#7f92ad}
  iframe{display:block;border:1px solid #2a3546;background:#06090f}
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>390 × 844 — iPhone</figcaption><iframe id="f390" src="index.html?w=390" width="390" height="844" scrolling="yes"></iframe></figure>
  <figure><figcaption>360 × 780 — Galaxy</figcaption><iframe id="f360" src="index.html?w=360" width="360" height="780" scrolling="yes"></iframe></figure>
  <figure><figcaption>768 × 900 — tablet</figcaption><iframe id="f768" src="index.html?w=768" width="768" height="900" scrolling="yes"></iframe></figure>
</div>
</body>
</html>
